<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NoMeOlvides — Basque Taberna</title>
  <link rel="stylesheet" href="/assets/css/fonts.css">
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: #f6ecde; font-family: Georgia, "Times New Roman", serif; }
    .mockup { width: min(1750px, 100%); margin: 0 auto; background: #f6ecde; }
    .approved-page-wrap { position: relative; }
    .approved-page-wrap--hero::before {
      content: "";
      position: absolute;
      z-index: 3;
      top: 0;
      left: 40.8%;
      right: 0;
      height: 3.15%;
      background: #260701 url("/assets/landing-sections/header-burgundy-texture-sample.png") center / auto 100% repeat-x;
      pointer-events: none;
    }
    .approved-page { display: block; width: 100%; height: auto; }
    .approved-navigation { position: absolute; inset: 0; width: 100%; height: 100%; }
    .approved-menu-categories { z-index: 2; }
    .approved-navigation a { cursor: pointer; outline: 0; }
    .nav-hit { fill: transparent; pointer-events: all; }
    .nav-focus { fill: none; stroke: transparent; stroke-width: 4; pointer-events: none; }
    .approved-navigation a:focus-visible .nav-focus { stroke: #e4b437; }
    .approved-target { position: absolute; left: 0; width: 1px; height: 1px; scroll-margin-top: 16px; }
    .header-strip-overlay {
      position: absolute;
      z-index: 4;
      top: .42%;
      left: 1.7%;
      right: 1.7%;
      height: 2.18%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 12.2%;
      align-items: center;
      gap: clamp(20px, 2.25vw, 40px);
      padding: 0;
      pointer-events: auto;
    }
    .header-nav-overlay {
      position: static;
      grid-column: 1;
      justify-self: end;
      min-width: 0;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(11px, 1.18vw, 26px);
      padding: 0 clamp(10px, 1vw, 20px);
      background: transparent;
      box-shadow: none;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(10.5px, 1.2vw, 21px);
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
    }
    .header-nav-overlay a {
      color: #f2e9dd;
      text-decoration: none;
      text-shadow: 0 1px 3px rgba(0, 0, 0, .65);
    }
    .header-nav-overlay a:hover,
    .header-nav-overlay a:focus-visible {
      color: #e4b437;
      outline: 0;
    }
    .header-reserve-overlay {
      position: static;
      grid-column: 2;
      justify-self: stretch;
      display: inline-flex;
      width: auto;
      height: 100%;
      align-items: center;
      justify-content: center;
      color: #f2e9dd;
      border: 2px solid #9eb300;
      border-radius: 5px;
      background: #260701;
      box-shadow: inset 0 0 0 1px rgba(228, 180, 55, .16);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(10px, 1.12vw, 20px);
      line-height: 1;
      text-decoration: none;
      text-shadow: 0 1px 3px rgba(0, 0, 0, .7);
      white-space: nowrap;
      pointer-events: auto;
    }
    .header-nav-overlay a,
    .header-reserve-overlay {
      cursor: pointer;
    }
    .header-reserve-overlay:hover,
    .header-reserve-overlay:focus-visible {
      color: #fff8df;
      outline: 3px solid rgba(228, 180, 55, .35);
      outline-offset: 2px;
    }
    .complete-menu-link {
      position: absolute;
      z-index: 3;
      left: 50.2%;
      top: -3.2%;
      transform: translate(-50%, -50%) scale(.67);
      transform-origin: center;
      display: inline-flex;
      align-items: center;
      gap: .45em;
      min-height: clamp(22px, 1.85vw, 32px);
      padding: clamp(5px, .48vw, 8px) clamp(10px, .92vw, 16px);
      color: #fff8df;
      border: 2px solid #b3842b;
      border-radius: 6px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .08), transparent 48%),
        linear-gradient(135deg, #12391e, #071f12);
      box-shadow:
        inset 0 0 0 1px rgba(255, 235, 172, .35),
        0 6px 16px rgba(18, 8, 3, .28);
      font-family: Montserrat, Arial, sans-serif;
      font-size: clamp(8px, .68vw, 11px);
      font-weight: 700;
      letter-spacing: .02em;
      text-decoration: none;
      white-space: nowrap;
    }
    .complete-menu-link::before {
      content: "";
      width: clamp(11px, .85vw, 15px);
      height: clamp(11px, .85vw, 15px);
      flex: none;
      background:
        linear-gradient(#d9ae45, #d9ae45) 50% 12% / 1px 78% no-repeat,
        linear-gradient(#d9ae45, #d9ae45) 23% 27% / 22% 1px no-repeat,
        linear-gradient(#d9ae45, #d9ae45) 77% 27% / 22% 1px no-repeat,
        linear-gradient(#d9ae45, #d9ae45) 23% 50% / 22% 1px no-repeat,
        linear-gradient(#d9ae45, #d9ae45) 77% 50% / 22% 1px no-repeat;
      border: 2px solid #d9ae45;
      border-radius: 3px;
      box-shadow: inset 50% 0 0 rgba(255, 255, 255, .08);
    }
    .complete-menu-link:hover,
    .complete-menu-link:focus-visible {
      color: #fffbe9;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .12), transparent 48%),
        linear-gradient(135deg, #185027, #082716);
      outline: 3px solid rgba(217, 174, 69, .35);
      outline-offset: 3px;
    }
    @media (max-width: 760px) {
      .header-strip-overlay {
        top: .42%;
        left: 1.5%;
        right: 1.5%;
        height: 2.18%;
        grid-template-columns: minmax(0, 1fr) 12.8%;
        gap: 9px;
      }
      .header-nav-overlay {
        gap: 6px;
        padding: 0 7px;
        font-size: clamp(8px, 1.75vw, 13px);
      }
      .approved-page-wrap--hero::before {
        left: 40.8%;
      }
      .header-reserve-overlay {
        font-size: clamp(7px, 1.65vw, 12px);
      }
      .complete-menu-link {
        left: 50.2%;
        top: -3.4%;
        border-radius: 6px;
      }
    }
  </style>
</head>
<body>
  <main class="mockup">
    <div class="approved-page-wrap approved-page-wrap--hero">
      <img class="approved-page" src="/assets/landing-sections/approved-full-before-menu-expand-v1.png" alt="Página principal aprobada de NoMeOlvides Basque Taberna">
      <div class="header-strip-overlay">
        <nav class="header-nav-overlay" aria-label="Navegación principal">
          <a href="/landing-full-preview">Inicio</a>
          <a href="/menu">Menú</a>
          <a href="/nuestra-taberna">Nuestra taberna</a>
          <a href="/galeria">Galería</a>
          <a href="#opiniones">Opiniones</a>
          <a href="#contacto">Contacto</a>
          <a href="#delivery">Delivery</a>
        </nav>
        <a class="header-reserve-overlay" href="#delivery">Reservar mesa</a>
      </div>
      <span id="delivery" class="approved-target" style="top:31.6%;" aria-hidden="true"></span>
      <svg class="approved-navigation" viewBox="0 0 1750 2872" preserveAspectRatio="none" aria-label="Navegación principal">
        <a href="#delivery" aria-label="Reservar mesa desde portada"><rect class="nav-hit" x="44" y="470" width="225" height="55"></rect><line class="nav-focus" x1="62" y1="520" x2="245" y2="520"></line></a>
        <a href="/menu" aria-label="Ver menú desde portada"><rect class="nav-hit" x="285" y="470" width="135" height="55"></rect><line class="nav-focus" x1="305" y1="520" x2="400" y2="520"></line></a>
        <a href="#delivery" aria-label="Delivery"><rect class="nav-hit" x="435" y="470" width="170" height="55"></rect><line class="nav-focus" x1="455" y1="520" x2="585" y2="520"></line></a>
      </svg>
    </div>

    <span id="menu-pending" class="approved-target" style="top:52%;" aria-hidden="true"></span>

    <div class="approved-page-wrap approved-page-wrap--menu-expanded">
      <span id="opiniones" class="approved-target" style="top:72%;" aria-hidden="true"></span>
      <span id="contacto" class="approved-target" style="top:72%;" aria-hidden="true"></span>
      <img class="approved-page" src="/assets/landing-sections/approved-full-after-menu-expand-v1.png" alt="Página principal aprobada de NoMeOlvides Basque Taberna">
      <svg class="approved-navigation approved-menu-categories" viewBox="0 0 1750 1150" preserveAspectRatio="none" aria-label="Categorías de la carta">
        <a href="/menu#armenia" aria-label="Abrir cocina armenia"><rect class="nav-hit" x="806" y="835" width="370" height="52"></rect><line class="nav-focus" x1="828" y1="880" x2="1154" y2="880"></line></a>
      </svg>
      <a class="complete-menu-link" href="/menu">Ver menú completo</a>
    </div>
  </main>
  <script>
    document.addEventListener('click', function(event) {
      var link = event.target.closest('a[href="#delivery"]');
      if (!link) return;
      var target = document.getElementById('delivery');
      if (!target) return;
      event.preventDefault();
      history.pushState(null, '', '#delivery');
      target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  </script>
</body>
</html>
